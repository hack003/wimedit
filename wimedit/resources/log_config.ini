; 日志配置文件 - 控制各模块的日志输出级别
; 三个级别：ERROR（只报错误，最简洁） / WARNING（警告+错误，默认） / DEBUG（全部，含进度）
; global_level: 所有未单独配置的模块默认级别
; 各模块级别覆盖 global_level

[log]
global_level = WARNING

; 挂载相关（DISM 挂载）
mount     = WARNING

; 卸载/清理（DISM unmount + cleanup）
unmount   = WARNING

; 镜像优化（wimlib optimize）
optimize  = WARNING

; 信息处理（wimlib info / --image-property）
info      = WARNING

; 其他系统输出（DISM 原始输出）
system    = ERROR

; 需要排查问题时，把下面改成 DEBUG 即可看到全部进度：
; global_level = DEBUG